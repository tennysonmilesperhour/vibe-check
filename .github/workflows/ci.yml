name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

# A newer push to a pull request replaces the run still going for the old one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npx --yes npm@12.2.1 ci --ignore-scripts
      - run: npm run lint
      # Known vulnerabilities in what ships to people's browsers fail the build.
      - run: npm audit --omit=dev --audit-level=high

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npx --yes npm@12.2.1 ci --ignore-scripts
      - run: npm test

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npx --yes npm@12.2.1 ci --ignore-scripts
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npx --yes npm@12.2.1 ci --ignore-scripts
      - run: npm run build
      - run: npm run check:bundle

  # Every page, the main flows and WCAG A/AA checks in a real browser, against
  # an in-memory Supabase (see e2e/ and the README).
  e2e:
    # Playwright 1.56 supports Ubuntu 24.04; latest moved to unsupported 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npx --yes npm@12.2.1 ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
