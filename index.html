<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vibe Check</title>
    <link rel="preload" as="image" href="/media/sanctuary.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="description" content="Your free daily journal, people and habit patterns, weekly and monthly reflections, and everyday practices. Track how your days actually feel and watch real patterns emerge." />
    <!-- Matches the woodland mobile header. -->
    <meta name="theme-color" content="#18231b" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=b1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=b1" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=b1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=b1" />
    <link rel="manifest" href="/manifest.json?v=b1" />

    <!-- Scrapers need absolute URLs; update these when a custom domain lands.
         Must be the public production origin (keep in sync with
         CANONICAL_ORIGIN in src/features/shell/UpdateToast.jsx) — the other
         vercel.app aliases sit behind Vercel SSO, which scrapers can't pass. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vibe Check" />
    <meta property="og:title" content="Vibe Check" />
    <meta property="og:description" content="Your free daily journal, people and habit patterns, weekly and monthly reflections, and everyday practices." />
    <meta property="og:url" content="https://vibe-check-flame-nu.vercel.app/" />
    <meta property="og:image" content="https://vibe-check-flame-nu.vercel.app/og.png?v=b1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vibe Check" />
    <meta name="twitter:description" content="Your free daily journal, people and habit patterns, weekly and monthly reflections, and everyday practices." />
    <meta name="twitter:image" content="https://vibe-check-flame-nu.vercel.app/og.png?v=b1" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
